tags:
  - Auth
summary: Register user
operationId: registerUser
description: 'Register user with payload data'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: 'user@example.com'
          password:
            description: "User's password"
            type: string
            example: 'User12345'
responses:
  '201':
    description: Successfully registered a user!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              required:
                - _id
                - name
                - email
              properties:
                _id:
                  type: integer
                  example: 123
                name:
                  type: string
                  example: 'John Doe'
                email:
                  type: string
                  example: 'user@example.com'
  '409':
    $ref: '../../../components/responses/409.yaml'